name: Vercel Production Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # This will create two parallel jobs: one for 'PWA' and one for 'DASHBOARD'
        project: [ 'PWA', 'DASHBOARD' ]

    steps:
      - uses: actions/checkout@v3

      - name: Deploy Patient PWA
        # This step will ONLY run for the 'PWA' job
        if: matrix.project == 'PWA'
        uses: vercel/vercel-action@v1
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          orgId: ${{ secrets.VERCEL_ORG_ID }}
          projectId: ${{ secrets.VERCEL_PROJECT_ID_PWA }}
          workingDirectory: 'patient-pwa' # The folder for the PWA
          production: true # This replaces 'vercel-args: --prod'

      - name: Deploy Clinic Dashboard
        # This step will ONLY run for the 'DASHBOARD' job
        if: matrix.project == 'DASHBOARD'
        uses: vercel/vercel-action@v1
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          orgId: ${{ secrets.VERCEL_ORG_ID }}
          projectId: ${{ secrets.VERCEL_PROJECT_ID_DASHBOARD }}
          workingDirectory: 'clinic-dashboard' # The folder for the Dashboard
          production: true # This replaces 'vercel-args: --prod'
